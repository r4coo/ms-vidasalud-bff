spring.application.name=ms-vidasalud-bff
server.port=${SERVER_PORT:8084}

# --- Microservicios internos (el BFF NO accede a bases de datos) ---
endpoints.appointments=${APPOINTMENTS_URL:http://localhost:8082}
endpoints.catalog=${CATALOG_URL:http://localhost:8087}
endpoints.rabbit-admin=${RABBIT_ADMIN_URL:http://localhost:8088}
endpoints.kafka-admin=${KAFKA_ADMIN_URL:http://localhost:8089}
endpoints.notification=${NOTIFICATION_URL:http://localhost:8085}

# --- CORS (orígenes del front separados por coma) ---
app.security.cors.allowed-origins=${FRONTEND_URLS:http://localhost:4200,http://localhost:3000}

# --- Microsoft Entra ID (OAuth 2.0 / OpenID Connect) ---
app.security.entra.tenant-id=${ENTRA_TENANT_ID:00000000-0000-0000-0000-000000000000}
app.security.entra.api-client-id=${ENTRA_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}
app.security.entra.jwk-set-uri=https://login.microsoftonline.com/${app.security.entra.tenant-id}/discovery/v2.0/keys

management.endpoints.web.exposure.include=health
